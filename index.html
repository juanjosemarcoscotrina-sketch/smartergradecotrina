      </table>
    </div>
  );
}
function ModuloRevision({selectedId,setSelectedId}){
  const {examenes,config,updateExamen,removeExamen,notify} = useApp();
  const [query,setQuery] = useState('');
  const [paginaActual,setPaginaActual] = useState(0);
  const [reasignando,setReasignando] = useState(false);
  const canvasRef = useRef(null);
  const exam = examenes.find(e=>e.id===selectedId) || examenes[0];

  useEffect(()=>{ if(!selectedId && examenes[0]) setSelectedId(examenes[0].id); },[examenes]);
  useEffect(()=>{ setPaginaActual(0); setReasignando(false); },[exam && exam.id]);

  const filtered = useMemo(()=>{
    const q = normalizeStr(query);
    return examenes.filter(e=> !q || normalizeStr(`${e.estudiante_detectado.apellidos} ${e.estudiante_detectado.nombres}`).includes(q));
  },[examenes,query]);

  const duplicadoDe = useMemo(()=>{
    if(!exam || !exam.rosterId) return null;
    return examenes.filter(e=>e.rosterId===exam.rosterId && e.id!==exam.id);
  },[examenes,exam]);

  useEffect(()=>{
    if(!exam || !canvasRef.current) return;
    let cancelled=false;
    renderExamPageCanvas(exam, paginaActual).then(off=>{
      if(cancelled) return;
      const canvas = canvasRef.current; if(!canvas) return;
      canvas.width = off.width; canvas.height = off.height;
      canvas.getContext('2d').drawImage(off,0,0);
    }).catch(()=>{});
    return ()=>{cancelled=true;};
  },[exam, paginaActual]);

  async function descargarPagina(){
    if(!exam) return;
    try{
      const off = await renderExamPageCanvas(exam, paginaActual);
      const blob = await new Promise(res=>off.toBlob(res,'image/jpeg',0.92));
      const filename = `Examen_${(exam.estudiante_detectado.apellidos+'_'+exam.estudiante_detectado.nombres).replace(/\s+/g,'_')}_pag${paginaActual+1}.jpg`;
      downloadBlob(filename, blob);
      notify('Página guardada.','ok');
    }catch(err){
      notify('No se pudo guardar el archivo.','error');
    }
  }
  async function descargarTodas(){
    if(!exam) return;
    try{
      const zip = new JSZip();
      for(let i=0;i<exam.paginas.length;i++){
        const off = await renderExamPageCanvas(exam, i);
        const blob = await new Promise(res=>off.toBlob(res,'image/jpeg',0.9));
        zip.file(`pagina_${i+1}.jpg`, blob);
      }
      const zipBlob = await zip.generateAsync({type:'blob'});
      const filename = `Examen_${(exam.estudiante_detectado.apellidos+'_'+exam.estudiante_detectado.nombres).replace(/\s+/g,'_')}.zip`;
      downloadBlob(filename, zipBlob);
      notify('Todas las páginas guardadas en un ZIP.','ok');
    }catch(err){ notify('No se pudo exportar el archivo.','error'); }
  }
  function reasignar(rosterId){
    const s = config.roster.find(r=>r.id===rosterId);
    if(!s) return;
    updateExamen(exam.id, e=>({...e, rosterId:s.id, estudiante_detectado:{...e.estudiante_detectado, apellidos:s.apellidos, nombres:s.nombres, confianza_identidad:1}}));
    setReasignando(false);
    notify('Alumno reasignado manualmente.','ok');
  }

  if(!exam){
    return <Card title="Revisión visual tipo QR" icon="eye"><div style={{color:'var(--ink-dim)'}}>Aún no hay exámenes procesados. Ve a "Captura" para generar o subir un lote.</div></Card>;
  }

  return (
    <div style={{display:'flex',gap:18,alignItems:'flex-start',flexWrap:'wrap'}}>
      <Card title="Exámenes" icon="search" style={{width:290,flexShrink:0}}
        extra={<Btn icon="x" onClick={()=>setQuery('')} style={{padding:'4px 8px'}}/>}>
        <input placeholder="Buscar por nombre…" value={query} onChange={e=>setQuery(e.target.value)} style={{width:'100%',marginBottom:10}}/>
        <div style={{maxHeight:560,overflow:'auto',display:'flex',flexDirection:'column',gap:4}}>
          {filtered.map(e=>(
            <div key={e.id} style={{display:'flex',alignItems:'stretch',gap:4}}>
              <button onClick={()=>setSelectedId(e.id)}
                style={{flex:1,textAlign:'left',padding:'8px 10px',borderRadius:8,border:'1px solid var(--line)',
                  background: e.id===exam.id ? 'var(--accent-soft)':'var(--surface)',fontSize:12.5}}>
                <div style={{fontWeight:600}}>{e.estudiante_detectado.apellidos}, {e.estudiante_detectado.nombres}</div>
                <div style={{display:'flex',gap:6,marginTop:4,alignItems:'center',flexWrap:'wrap'}}>
                  <Pill tone="accent">Fila {e.fila}</Pill>
                  <span className="tabular" style={{color:'var(--ink-dim)'}}>{e.calificacion.nota_total}/{e.calificacion.nota_maxima_total}</span>
                  {e.estado==='PENDIENTE_AUDITORIA' && <Pill tone="warn">Auditar</Pill>}
                  {e.estudiante_detectado.confianza_identidad<0.7 && <Pill tone="bad">Identidad incierta</Pill>}
                </div>
              </button>
              <button onClick={()=>removeExamen(e.id)} title="Eliminar este examen"
                style={{border:'1px solid var(--line)',borderRadius:8,background:'var(--surface)',color:'var(--bad)',width:32,display:'grid',placeItems:'center'}}>
                <Icon name="trash" size={13}/>
              </button>
            </div>
          ))}
        </div>
      </Card>
      <Card title={`${exam.estudiante_detectado.apellidos}, ${exam.estudiante_detectado.nombres}`} icon="eye"
        extra={<div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <Btn icon="download" onClick={descargarPagina}>Descargar página (JPG)</Btn>
          {exam.paginas.length>1 && <Btn variant="solid" icon="package" onClick={descargarTodas}>Descargar todo (ZIP)</Btn>}
          {exam.paginas.length<=1 && <Btn variant="solid" icon="download" onClick={descargarPagina}>Descargar examen marcado</Btn>}
        </div>}
        style={{flex:1,minWidth:340}}>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12,alignItems:'center'}}>
          <Pill tone="accent">Fila {exam.fila}</Pill>
          <Pill tone={exam.estudiante_detectado.confianza_identidad>=0.7?'accent':'bad'}>Confianza identidad: {Math.round(exam.estudiante_detectado.confianza_identidad*100)}%</Pill>
          <Pill tone={exam.estado==='COMPLETO'?'ok':'warn'}>{exam.estado==='COMPLETO'?'Auditado / Completo':'Pendiente de auditoría'}</Pill>
          <Pill tone="void">{exam.origen==='IA'?'Calificado por IA':'Modo demostración'}</Pill>
          {duplicadoDe && duplicadoDe.length>0 && <Pill tone="bad">Posible duplicado ({duplicadoDe.length})</Pill>}
          <div style={{marginLeft:'auto'}}>
            {!reasignando ? (
              <Btn icon="users" onClick={()=>setReasignando(true)}>¿Alumno equivocado? Reasignar</Btn>
            ) : (
              <select autoFocus defaultValue="" onChange={e=>e.target.value && reasignar(e.target.value)} style={{fontSize:12.5}}>
                <option value="" disabled>Elegir alumno correcto…</option>
                {config.roster.map(r=><option key={r.id} value={r.id}>{r.apellidos}, {r.nombres}</option>)}
              </select>
            )}
          </div>
        </div>
        {exam.paginas.length>1 && (
          <div style={{display:'flex',gap:6,marginBottom:10}}>
            {exam.paginas.map((_,i)=>(
              <button key={i} onClick={()=>setPaginaActual(i)}
                style={{padding:'5px 12px',borderRadius:8,border:'1px solid var(--line)',fontSize:12,fontWeight:600,
                  background: paginaActual===i?'var(--accent)':'var(--surface)', color: paginaActual===i?'var(--accent-ink)':'var(--ink)'}}>
                Página {i+1}
              </button>
            ))}
          </div>
        )}
        <div className="scrollx" style={{border:'1px solid var(--line)',borderRadius:10,background:'var(--surface-2)',padding:10}}>
          <canvas ref={canvasRef} style={{width:'100%',maxWidth:640,display:'block',margin:'0 auto',borderRadius:6}}/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:8,marginTop:14,marginBottom:18}}>
          {Object.entries(ESTADO_LABEL).map(([k,label])=>(
            <div key={k} style={{textAlign:'center'}}>
              <Pill tone={ESTADO_TONE[k]}>{exam.resumen_estados[{CORRECTA:'correctas',INCORRECTA:'incorrectas',ANULADA:'anuladas',EN_BLANCO:'en_blanco',DUDOSA_REVISION:'dudosas'}[k]]}</Pill>
              <div style={{fontSize:10.5,color:'var(--ink-dim)',marginTop:4}}>{label}</div>
            </div>
          ))}
        </div>
        <h3 className="font-display" style={{fontSize:14.5,fontWeight:600,margin:'0 0 8px'}}>Detalle por pregunta</h3>
        <DetalleReporte exam={exam}/>
      </Card>
    </div>
  );
}

/* ============================== MODULE 5A — ANALÍTICA ============================== */
function Sparkbar({value,max,color,label,sub}){
  const pct = max>0 ? clamp(value/max*100,0,100) : 0;
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:11.5,marginBottom:4}}>
        <span>{label}</span><span className="tabular" style={{color:'var(--ink-dim)'}}>{sub}</span>
      </div>
      <div style={{height:8,borderRadius:5,background:'var(--surface-2)',overflow:'hidden'}}>
        <div style={{height:'100%',width:pct+'%',background:color,borderRadius:5}}/>
      </div>
    </div>
  );
}
function ModuloAnalitica(){
  const {examenes,config} = useApp();
  const completos = examenes.filter(e=>e.estado==='COMPLETO');
  if(!completos.length){
    return <Card title="Analítica psicométrica" icon="chart"><div style={{color:'var(--ink-dim)'}}>Aún no hay exámenes completos (auditados) para analizar.</div></Card>;
  }
  const notas = completos.map(e=>e.calificacion.nota_total);
  const promedio = round1(notas.reduce((a,b)=>a+b,0)/notas.length);
  const max = round1(Math.max(...notas)), min = round1(Math.min(...notas));
  const aprobTeoria = round1(100*completos.filter(e=>e.calificacion.teoria_obtenida/e.calificacion.teoria_maxima*100 >= config.notaAprobacion).length/completos.length);
  const aprobPractica = round1(100*completos.filter(e=>e.calificacion.practica_obtenida/e.calificacion.practica_maxima*100 >= config.notaAprobacion).length/completos.length);
  const aprobTotal = round1(100*completos.filter(e=>e.calificacion.nota_total>=config.notaAprobacion).length/completos.length);

  const bins = new Array(10).fill(0);
  notas.forEach(n=>{ const i=clamp(Math.floor(n/10),0,9); bins[i]++; });
  const binMax = Math.max(...bins,1);

  const preguntaStats = {};
  completos.forEach(e=>{
    e.preguntas.forEach(p=>{
      if(!preguntaStats[p.numero]) preguntaStats[p.numero]={numero:p.numero,seccion:p.seccion,total:0,fallo:0};
      preguntaStats[p.numero].total++;
      if(p.estado==='INCORRECTA'||p.estado==='ANULADA') preguntaStats[p.numero].fallo++;
    });
  });
  const dificultad = Object.values(preguntaStats).map(s=>({...s,pct: round1(100*s.fallo/s.total)})).sort((a,b)=>a.numero-b.numero);
  const criticas = dificultad.filter(d=>d.pct>70);

  const W=560,H=170,padL=30,padB=22;
  const barW = (W-padL-10)/10 - 6;

  return (
    <div style={{maxWidth:1060}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',gap:12,marginBottom:18}}>
        {[
          ['Promedio',promedio,'var(--accent)'],
          ['Máxima',max,'var(--ok)'],
          ['Mínima',min,'var(--bad)'],
          ['Aprobación total',aprobTotal+'%','var(--accent)'],
        ].map(([label,val,color])=>(
          <div key={label} style={{background:'var(--surface)',border:'1px solid var(--line)',borderRadius:12,padding:16,boxShadow:'var(--shadow)'}}>
            <div style={{fontSize:11,color:'var(--ink-dim)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.04em'}}>{label}</div>
            <div className="tabular font-display" style={{fontSize:28,fontWeight:600,color,marginTop:4}}>{val}</div>
          </div>
        ))}
      </div>

      <Card title="Tasa de aprobación por componente" icon="chart">
        <div style={{display:'flex',flexDirection:'column',gap:14,maxWidth:520}}>
          <Sparkbar value={aprobTeoria} max={100} color="var(--accent)" label="Teoría" sub={aprobTeoria+'%'}/>
          <Sparkbar value={aprobPractica} max={100} color="var(--accent)" label="Práctica" sub={aprobPractica+'%'}/>
          <Sparkbar value={aprobTotal} max={100} color="var(--accent)" label="Nota final" sub={aprobTotal+'%'}/>
        </div>
      </Card>

      <Card title="Distribución de calificaciones" icon="chart">
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{maxWidth:600,color:'var(--ink-dim)'}}>
          <line x1={padL} y1={H-padB} x2={W} y2={H-padB} stroke="currentColor" strokeWidth="1"/>
          {bins.map((v,i)=>{
            const h = (H-padB-14) * v/binMax;
            const x = padL + i*((W-padL-10)/10) + 3;
            const y = H-padB-h;
            return (
              <g key={i}>
                <rect x={x} y={y} width={barW} height={h} fill="var(--accent)" rx="3"/>
                {v>0 && <text x={x+barW/2} y={y-4} fontSize="9.5" textAnchor="middle" fill="currentColor">{v}</text>}
                <text x={x+barW/2} y={H-padB+13} fontSize="9" textAnchor="middle" fill="currentColor">{i*10}-{i*10+9}</text>
              </g>
            );
          })}
        </svg>
      </Card>

      <Card title="Índice de dificultad por pregunta" icon="alert"
        extra={criticas.length>0 && <Pill tone="bad">{criticas.length} pregunta(s) con &gt;70% de error</Pill>}>
        <div className="scrollx">
          <div style={{display:'flex',gap:3,minWidth:dificultad.length*22,paddingBottom:6}}>
            {dificultad.map(d=>(
              <div key={d.numero} title={`Pregunta ${d.numero}: ${d.pct}% de error`} style={{display:'flex',flexDirection:'column',alignItems:'center',width:20}}>
                <div style={{height:90,display:'flex',alignItems:'flex-end'}}>
                  <div style={{width:14,height:Math.max(3,90*d.pct/100),background: d.pct>70?'var(--bad)':d.pct>40?'var(--warn)':'var(--ok)',borderRadius:'3px 3px 0 0'}}/>
                </div>
                <div className="tabular" style={{fontSize:8.5,color:'var(--ink-dim)',marginTop:3}}>{d.numero}</div>
              </div>
            ))}
          </div>
        </div>
        {criticas.length>0 && (
          <div style={{marginTop:12,padding:12,background:'var(--bad-soft)',borderRadius:9,fontSize:12.5,color:'var(--bad)'}}>
            <strong>Alerta de redacción / refuerzo docente:</strong> pregunta(s) {criticas.map(c=>c.numero).join(', ')} fallada(s) por más del 70% del curso. Revisar redacción del ítem o reforzar el tema en clase.
          </div>
        )}
      </Card>
    </div>
  );
}

/* ============================== MODULE 5B — PLANILLA ============================== */
function estadoAlerta(e){
  if(e.estado==='PENDIENTE_AUDITORIA') return 'Auditoría pendiente';
  if(e.estudiante_detectado.confianza_identidad < 0.7) return 'Identidad incierta';
  return '—';
}
function csvEscape(v){
  const s = String(v ?? '');
  return /[",\n;]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function ModuloPlanilla(){
  const {examenes,config,notify} = useApp();
  const rows = useMemo(()=>{
    return [...examenes].sort((a,b)=>{
      const A = `${a.estudiante_detectado.apellidos} ${a.estudiante_detectado.nombres}`;
      const B = `${b.estudiante_detectado.apellidos} ${b.estudiante_detectado.nombres}`;
      return A.localeCompare(B,'es');
    });
  },[examenes]);

  async function exportarCSV(){
    const header = ['#','Apellidos y Nombres','Fila','Nota Teoría','Nota Práctica','Nota Final','Preguntas falladas (N°:marcó→correcto)','Alertas Pendientes','Estado'];
    const lines = [header.join(';')];
    rows.forEach((e,i)=>{
      const falladas = e.preguntas.filter(p=>p.estado==='INCORRECTA'||p.estado==='ANULADA')
        .map(p=>`${p.numero}:${p.inciso_marcado}→${p.inciso_correcto}`).join(', ');
      lines.push([
        i+1,
        `${e.estudiante_detectado.apellidos}, ${e.estudiante_detectado.nombres}`,
        e.fila,
        e.calificacion.teoria_obtenida,
        e.calificacion.practica_obtenida,
        e.calificacion.nota_total,
        falladas,
        estadoAlerta(e),
        e.estado==='COMPLETO'?'Completo':'Pendiente'
      ].map(csvEscape).join(';'));
    });
    const csv = '﻿'+lines.join('\n');
    try{
      downloadBlob('Planilla_SmartGraderPro.csv', csv);
      notify('Planilla exportada a CSV.','ok');
    }catch(err){ notify('No se pudo exportar el archivo.','error'); }
  }

  async function exportarReportes(){
    if(!window.JSZip) return notify('Empaquetador no disponible.','error');
    const zip = new JSZip();
    for(let i=0;i<rows.length;i++){
      const e = rows[i];
      try{
        const off = await renderExamPageCanvas(e, 0);
        const blob = await new Promise(res=>off.toBlob(res,'image/jpeg',0.88));
        zip.file(`${String(i+1).padStart(3,'0')}_${(e.estudiante_detectado.apellidos+'_'+e.estudiante_detectado.nombres).replace(/\s+/g,'_')}.jpg`, blob);
      }catch(err){}
    }
    const blob = await zip.generateAsync({type:'blob'});
    try{
      downloadBlob('Reportes_SmartGraderPro.zip', blob);
      notify('Paquete de reportes generado (incluye la página principal marcada de cada examen).','ok');
    }catch(err){ notify('No se pudo exportar el paquete.','error'); }
  }

  return (
    <Card title="Planilla consolidada" icon="table"
      extra={<div style={{display:'flex',gap:8}}>
        <Btn icon="download" onClick={exportarCSV}>Exportar a Excel / CSV</Btn>
        <Btn variant="solid" icon="package" onClick={exportarReportes}>Exportar todos los reportes</Btn>
      </div>}>
      <div className="scrollx">
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12.6}}>
          <thead>
            <tr style={{textAlign:'left',color:'var(--ink-dim)',borderBottom:'1px solid var(--line)'}}>
              {['#','Apellidos y Nombres','Fila','Nota Teoría','Nota Práctica','Nota Final','Alertas','Estado'].map(h=>(
                <th key={h} style={{padding:'7px 10px',whiteSpace:'nowrap'}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((e,i)=>{
              const alerta = estadoAlerta(e);
              return (
                <tr key={e.id} style={{borderBottom:'1px solid var(--line)'}}>
                  <td className="tabular" style={{padding:'7px 10px'}}>{i+1}</td>
                  <td style={{padding:'7px 10px',fontWeight:600}}>{e.estudiante_detectado.apellidos}, {e.estudiante_detectado.nombres}</td>
                  <td style={{padding:'7px 10px'}}><Pill tone="accent">{e.fila}</Pill></td>
                  <td className="tabular" style={{padding:'7px 10px'}}>{e.calificacion.teoria_obtenida}/{e.calificacion.teoria_maxima}</td>
                  <td className="tabular" style={{padding:'7px 10px'}}>{e.calificacion.practica_obtenida}/{e.calificacion.practica_maxima}</td>
                  <td className="tabular" style={{padding:'7px 10px',fontWeight:700,color: e.calificacion.nota_total>=config.notaAprobacion?'var(--ok)':'var(--bad)'}}>{e.calificacion.nota_total}/{e.calificacion.nota_maxima_total}</td>
                  <td style={{padding:'7px 10px'}}>{alerta==='—' ? <span style={{color:'var(--ink-dim)'}}>—</span> : <Pill tone="warn">{alerta}</Pill>}</td>
                  <td style={{padding:'7px 10px'}}><Pill tone={e.estado==='COMPLETO'?'ok':'warn'}>{e.estado==='COMPLETO'?'Completo':'Pendiente'}</Pill></td>
                </tr>
              );
            })}
            {!rows.length && <tr><td colSpan={8} style={{padding:20,textAlign:'center',color:'var(--ink-dim)'}}>Sin exámenes procesados todavía.</td></tr>}
          </tbody>
        </table>
      </div>
    </Card>
  );
}

/* ============================== MODULE 6 — IA / CONECTOR ============================== */
function ModuloConector(){
  const {sampleClient,sampleLimits,notify} = useApp();
  const [testing,setTesting] = useState(false);
  const [testResult,setTestResult] = useState(null);
  const iaLista = sampleClient !== undefined && sampleClient !== null;
  const iaCargando = sampleClient === undefined;

  const schemaSnippet = `{
  "estudiante_detectado": {"apellidos":"string","nombres":"string","fila":"A|B"},
  "preguntas": [
    {"numero":1,"pagina":0,"inciso_marcado":"A|B|C|D|E|MULTIPLE|NINGUNO|ILEGIBLE","coordenadas_aprox":{"x":25,"y":40}}
  ]
}`;

  async function probarIA(){
    if(!sampleClient) return;
    setTesting(true); setTestResult(null);
    try{
      const {text} = await sampleClient('Responde únicamente con la palabra: OK', {modelTier:'quick', cache:false});
      setTestResult({ok:true,msg:`IA respondió correctamente: "${text.trim()}"`});
    }catch(err){
      setTestResult({ok:false,msg:sampleErrorMessage(err)});
    }
    setTesting(false);
  }

  return (
    <div style={{maxWidth:900}}>
      <Card title="Motor de calificación por IA" icon="sparkles">
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',borderRadius:10,marginBottom:14,
          background: iaLista?'var(--ok-soft)': iaCargando?'var(--surface-2)':'var(--bad-soft)',
          color: iaLista?'var(--ok)': iaCargando?'var(--ink-dim)':'var(--bad)'}}>
          <Icon name={iaLista?'sparkles':iaCargando?'refresh':'ban'} size={18}/>
          <div>
            <div style={{fontWeight:700,fontSize:13.5}}>
              {iaCargando?'Verificando…': iaLista?'IA de calificación disponible':'IA de calificación no disponible en esta vista'}
            </div>
            <div style={{fontSize:12,opacity:0.9}}>
              {iaLista ? `Puede analizar hasta ${sampleLimits?.images?.maxCount ?? '—'} foto(s) por examen (tipos: ${sampleLimits?.images?.mediaTypes?.join(', ') || 'imagen'}).` :
               'Configura ANTHROPIC_API_KEY en las variables de entorno de tu sitio de Netlify y vuelve a desplegar para habilitar la calificación con IA.'}
            </div>
          </div>
        </div>
        <p style={{fontSize:12.5,color:'var(--ink-dim)'}}>
          SmartGrader Pro llama a la función serverless <code className="mono">/.netlify/functions/grade</code>, que reenvía las fotos a la API de Claude (Anthropic) usando la API key que configures en Netlify — tu key nunca se expone en el navegador. Cada vez que procesas un examen (en "Captura"), se envían las fotos de ESE alumno junto con la clave oficial y el roster, y la IA transcribe qué inciso marcó en cada pregunta. El motor de calificación de SmartGrader Pro (determinístico, no la IA) calcula la nota a partir de esa transcripción, así que el puntaje siempre es exacto y auditable.
        </p>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <Btn variant="solid" icon="zap" onClick={probarIA} disabled={testing || !iaLista}>{testing?'Probando…':'Probar IA'}</Btn>
          {testResult && <span style={{fontSize:12.5,color: testResult.ok?'var(--ok)':'var(--bad)'}}>{testResult.msg}</span>}
        </div>
      </Card>

      <Card title="Contrato JSON que devuelve la IA por examen" icon="fileText">
        <p style={{fontSize:12.5,color:'var(--ink-dim)',marginTop:0}}>La IA solo transcribe identidad y marcas — no califica. SmartGrader Pro cruza esto con la clave oficial de la fila correspondiente para calcular teoría, práctica y nota final, y ubica cada marca con "coordenadas_aprox" sobre la foto real para dibujar el overlay sin superposiciones.</p>
        <pre className="mono scrollx" style={{background:'var(--surface-2)',padding:14,borderRadius:9,fontSize:11.2,lineHeight:1.6}}>{schemaSnippet}</pre>
      </Card>

      <Card title="Sobre subir archivos desde Google Drive" icon="upload">
        <p style={{fontSize:12.5,color:'var(--ink-dim)',margin:0}}>
          Este sitio no se conecta directamente a una cuenta de Drive específica (por diseño, para que cualquier cuenta funcione sin iniciar sesión aquí). Para usar fotos guardadas en Drive: ábrelas en Drive, usa "Descargar" para guardarlas en tu dispositivo, y luego selecciónalas normalmente en "Captura" — funciona igual sin importar con qué cuenta de Google las subiste a Drive.
        </p>
      </Card>

      <Card title="Modo demostración (simulador)" icon="wand">
        <p style={{fontSize:12.5,color:'var(--ink-dim)',margin:0}}>
          El botón "Generar y calificar (demo)" en Captura sigue disponible para practicar el flujo completo con datos 100% inventados, sin gastar llamadas de IA ni requerir fotos reales. Los exámenes generados así se marcan como "Modo demostración" en Revisión QR y Planilla para que nunca se confundan con calificaciones reales.
        </p>
      </Card>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
